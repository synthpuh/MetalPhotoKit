name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version
        
      - run: xcodebuild -downloadComponent MetalToolchain

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
